summary: Verify the discourse-mcp snap can serve MCP requests

execute: |
    coproc MCP { discourse-mcp --log_level silent --tools_mode discourse_api_only; }

    printf '%s\n' \
        '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"spread-smoke-test","version":"1.0.0"}}}' \
        '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}' \
        '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"discourse_search","arguments":{"query":"snapcraft","max_results":1}}}' \
        >&${MCP[1]}

    deadline=$((SECONDS+30))
    found_initialize=false
    found_search=false

    while [ $SECONDS -lt $deadline ]; do
        if IFS= read -r -t 1 line <&${MCP[0]}; then
            echo "$line"
            id="$(printf '%s\n' "$line" | jq -r '.id // empty')"

            if [ "$id" = "1" ]; then
                found_initialize=true
            fi

            if [ "$id" = "2" ] && printf '%s\n' "$line" | jq -e '.result.content[0].text | fromjson | .results | length >= 1' >/dev/null; then
                found_search=true
                break
            fi
        fi
    done

    kill "$MCP_PID" 2>/dev/null || true

    [ "$found_initialize" = true ]
    [ "$found_search" = true ]

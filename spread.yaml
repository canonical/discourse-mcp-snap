project: discourse-mcp-snap

backends:
    garden:
        type: adhoc
        allocate: |
            if [ -n "${SPREAD_HOST_PATH-}" ]; then
                PATH="${SPREAD_HOST_PATH}"
            fi
            exec image-garden allocate --spread \
               "$SPREAD_SYSTEM"."${SPREAD_ARCH:=$(uname -m)}"
        discard: |
            if [ -n "${SPREAD_HOST_PATH-}" ]; then
                PATH="${SPREAD_HOST_PATH}"
            fi
            image-garden discard "$SPREAD_SYSTEM_ADDRESS"
        systems:
            - ubuntu-cloud-24.04:
                  username: ubuntu
                  password: ubuntu
            - ubuntu-cloud-26.04:
                  username: ubuntu
                  password: ubuntu
            - debian-cloud-13:
                  username: debian
                  password: debian
            - fedora-cloud-43:
                  username: fedora
                  password: fedora

exclude:
    - ".git/*"

path: /root/discourse-mcp-snap

prepare: |
    snap install "$(ls ./discourse-mcp_*.snap | sort -r | head -n 1)" --dangerous

    if command -v apt-get >/dev/null; then
        apt-get update
        apt-get install -y jq
    elif command -v dnf >/dev/null; then
        dnf install -y jq
    else
        echo "No supported package manager found for installing jq" >&2
        exit 1
    fi

debug-each: |
    echo "Kernel and architecture:"
    uname -a

    echo "OS release info:"
    cat /etc/os-release

    echo "Installed snaps:"
    snap list

suites:
    tests/smoke/:
        summary: Smoke tests for the discourse-mcp snap

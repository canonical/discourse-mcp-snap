name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to create (for example v0.2.9)
        required: true
        type: string
      target:
        description: Branch to tag from
        required: false
        default: master
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: create release notes
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve release context
        id: context
        uses: actions/github-script@v9
        with:
          script: |
            const isDispatch = context.eventName === "workflow_dispatch";
            const version = isDispatch ? context.payload.inputs?.version : context.ref.replace("refs/tags/", "");
            const target = isDispatch ? (context.payload.inputs?.target || "master") : context.payload.repository.default_branch;

            if (!version || !/^v\d+\.\d+\.\d+(?:[-+].*)?$/.test(version)) {
              core.setFailed(`Invalid tag '${version}'. Use format v<major>.<minor>.<patch>.`);
              return;
            }

            core.setOutput("tag", version);
            core.setOutput("target", target);

      - name: Validate release tag against packaged version
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.context.outputs.tag }}
          TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && steps.context.outputs.target || steps.context.outputs.tag }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const releaseTag = process.env.RELEASE_TAG;
            const targetRef = process.env.TARGET_REF;

            const content = await github.rest.repos.getContent({
              owner,
              repo,
              path: "snap/snapcraft.yaml",
              ref: targetRef,
            });

            if (!("content" in content.data)) {
              core.setFailed("Could not read snap/snapcraft.yaml from target ref.");
              return;
            }

            const snapcraft = Buffer.from(content.data.content, "base64").toString("utf8");
            const versionMatch = /^version:\s*([^\s#]+).*$/m.exec(snapcraft);
            if (!versionMatch) {
              core.setFailed("Could not read version from snap/snapcraft.yaml.");
              return;
            }

            const packagedTag = `v${versionMatch[1]}`;
            if (releaseTag !== packagedTag) {
              core.setFailed(`Release tag ${releaseTag} must match packaged snap version ${packagedTag}.`);
              return;
            }

      - name: Create tag from target branch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.context.outputs.tag }}
          TARGET_BRANCH: ${{ steps.context.outputs.target }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.RELEASE_TAG;
            const targetBranch = process.env.TARGET_BRANCH;

            const branch = await github.rest.repos.getBranch({ owner, repo, branch: targetBranch });
            const sha = branch.data.commit.sha;

            try {
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

      - name: Create or update release
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.context.outputs.tag }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentTag = process.env.RELEASE_TAG;
            const body = "Automated release for Discourse MCP snap.";

            try {
              const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag: currentTag });
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: existing.data.id,
                tag_name: currentTag,
                name: currentTag,
                body,
                draft: false,
                prerelease: false,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: currentTag,
                name: currentTag,
                body,
                draft: false,
                prerelease: false,
              });
            }
